name: Deploy to Environments

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd 03-github-actions/sample-app
        npm ci
    
    - name: Build application
      run: |
        cd 03-github-actions/sample-app
        npm run build
    
    - name: Deploy to Staging
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Environment: staging"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        
        # Simulate deployment
        ./03-github-actions/scripts/deploy.sh staging
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests on staging..."
        sleep 5
        echo "✅ Smoke tests passed!"
    
    - name: Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Staging deployment successful!"
        else
          echo "❌ Staging deployment failed!"
        fi

  deploy-production:
    if: github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    needs: [deploy-staging]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        cd 03-github-actions/sample-app
        npm ci
    
    - name: Build application
      run: |
        cd 03-github-actions/sample-app
        npm run build
    
    - name: Deploy to Production
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Environment: production"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        
        # Simulate deployment with additional safety checks
        ./03-github-actions/scripts/deploy.sh production
    
    - name: Run health checks
      run: |
        echo "🏥 Running health checks on production..."
        sleep 10
        echo "✅ Health checks passed!"
    
    - name: Create deployment tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a "deploy-$(date +'%Y%m%d-%H%M%S')" -m "Production deployment"
    
    - name: Notify deployment success
      if: success()
      run: |
        echo "🎉 Production deployment successful!"
        echo "Application is now live!"